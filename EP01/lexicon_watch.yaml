# Lexicon watch - "reinvent or remember?" (series bible §6). Frozen per episode (hash in the run header).
# Matching: case-insensitive, whole words / whole phrases, over every islander text in the log
# (reasoning, say, laws, drawings, dying words, stories, retellings).
# outside_world: real-world names and modern things the islanders cannot know -> flagged as "remembered".
#   Includes "petri": the audience-facing name of the world, which the islanders never hear.
# institutions: generic institution words -> first appearance per island is a milestone, not a leak.
# The engine also refuses to give a newborn a name on either list, and tests assert that no prompt,
# rule text or genesis file contains an outside_world term.
