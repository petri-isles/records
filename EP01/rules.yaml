# THE ARCHIPELAGO (on screen: the Petri Isles) - base world rules (declarative).
# Every number here drives the engine directly: edit a value, rerun, behaviour changes. No code edits.
# Action `desc` strings are str.format templates over the action's own spec (+ `eff`, the effective
# yields on the agent's island, and `sea`), so agents are always told the numbers that apply to them.
# Nothing in this file may contain real-world names; tests scan it against lexicon_watch.yaml.

name: archipelago-base
version: 2
resources: [food, wood, tools]
wealth_weights: {food: 1, wood: 1, tools: 4}   # used for the wealth Gini metric

calendar:
  ticks_per_year: 4                             # 1 tick = 1 season
  adult_age: 16                                 # named children act (LLM calls) from this age

season_cycle: [spring, summer, autumn, winter]
seasons:                                        # length in ticks; gather = yield multiplier
  spring: {length: 1, gather: {food: 1.0, wood: 1.0}}
  summer: {length: 1, gather: {food: 1.3, wood: 1.0}}
  autumn: {length: 1, gather: {food: 1.0, wood: 1.2}}
  winter: {length: 1, gather: {food: 0.4, wood: 0.8}}

weather:                                        # drawn each tick from the seeded RNG
  calm:  {p: 0.65, gather: 1.0}
  rain:  {p: 0.25, gather: 0.8}
  storm: {p: 0.10, gather: 0.4}

yield_mult: {food: 1.0, wood: 1.0}              # island geography: multiplies gathering AND wild regrowth

wild:                                           # natural pool per island
  regen: {food: 30, wood: 6}                    # per tick, x yield_mult (cal02: 20 = bare need; no slack)
  cap:   {food: 150, wood: 100}

sea:                                            # crossing to a linked island (trade / give / migrate)
  crossing_cost: {wood: 2}                      # paid by the sailor, used up
  max_cargo: 6                                  # most units of one resource a boat carries
  storm: {cargo_loss_p: 0.35, sailor_loss_p: 0.05}

consumption:
  agent: {food: 1}                              # per named adult per tick
  child: {food: 1}                              # per named child: own goods, then a parent's, then the store
  agents_eat_from_commons: true                 # cal01: islanders starved beside full stores; the store feeds any hungry adult

starvation:
  hunger_limit: 3                               # consecutive unfed ticks -> death

spoilage:                                       # cal02: hoards of 50+ food per islander while villagers starved
  food_above: 10                                # carried food above this ...
  food_rate: 0.1                                # ... loses floor(10%) each season; the island store does not spoil

aging:
  enabled: true
  # [from_age, annual probability of a natural death]; applied per tick as 1-(1-p)^(1/ticks_per_year)
  annual_hazard: [[0, 0.002], [40, 0.006], [50, 0.015], [55, 0.03], [60, 0.05], [65, 0.09], [70, 0.16], [75, 0.28], [80, 0.45]]

death:
  inventory_to: commons                         # commons | lost

relations: {min: -1.0, max: 1.0}

memory:
  keep_recent: 6                                # rolling short-term notes shown in the prompt
  inherited_shown: 2                            # most recent inherited memories shown in the prompt
  pass_on_words: 40                             # dying words / story length asked for

birth:                                          # named-agent birth (no LLM involved)
  enabled: true
  min_age: 18
  max_age: 45
  opposite_sex: true                            # births are biological: a woman and a man, never relatives
  min_mutual_relation: 0.3                      # both directions (cal02-03: 0 births in 10 years at 0.5 and 0.4)
  min_food_each: 4
  cost_food_each: 3                             # paid by each parent, handed to the child
  prob: 0.06                                    # per island per tick, for the best-bonded pair
  max_named_per_island: 8                       # children count; also caps migration
  parent_relation: 0.6
  syllables: ["ta", "vi", "lu", "mo", "ke", "sa", "on", "do", "ri", "na", "be", "lo", "pa", "zu"]  # quoted: YAML reads bare on/no as booleans

crowd:                                          # unnamed villagers, purely numeric, no LLM calls
  gather_per_capita: {food: 1.25, wood: 0.2}      # cal01-mock: 1.1 starved every island at x1.0 (seasons x weather avg 0.82)
  store_target_seasons: 3                         # cal03: villagers gather food only until the store holds 3 seasons of theirs
  consume_per_capita: {food: 1.0}
  starvation_death_rate: 0.2                    # binomial per unfed person per tick
  birth_rate: 0.02                              # binomial per person per tick, only when fed with surplus
  surplus_food_per_capita: 2.0
  birth_min_wild_share: 0.5                       # cal03: and multiply only while the wild holds >= half its cap

gm:
  fallback_action: rest                         # used after max_retries rejected replies

# Preconditions are data: target (none|agent|island), reach (island|linked), resource / want (allowed
# lists), amount {min,max}, cost {res: n}, needs_own (actor must hold `amount` of `resource`),
# requires_say. `effect` picks the handler in gm.py; the numbers it uses live next to it.
# reach: linked = a person on your island OR on an island linked by boat (crossing rules in `sea`).
actions:
  gather:
    desc: "take food or wood from the wild (set resource). On your island this yields about {eff[food]} food or {eff[wood]} wood in a calm spring, +{tool_bonus} if you hold a tool."
    enabled: true
    effect: gather
    target: none
    resource: [food, wood]
    yields: {food: 3, wood: 2}
    tool_bonus: 1
    tool_break_prob: 0.1
  rest:
    desc: "do nothing this season."
    enabled: true
    effect: none
    target: none
  craft:
    desc: "turn {cost[wood]} wood into {produces[tools]} tool."
    enabled: true
    effect: convert
    target: none
    cost: {wood: 3}
    produces: {tools: 1}
  trade:
    desc: "offer a person `amount` of your `resource` for `amount` x {rate} of their `want`. They accept if they feel at least {accept_min_relation} toward you and have it. The person may be on another island: then you sail there."
    enabled: true
    effect: trade
    target: agent
    reach: linked
    resource: [food, wood, tools]
    want: [food, wood, tools]
    amount: {min: 1, max: 10}
    needs_own: true
    rate: 1.0
    accept_min_relation: -0.2
    relation_on_accept: 0.1
    relation_on_decline: -0.05
  give:
    desc: "give a person `amount` of your `resource`. The person may be on another island: then you sail there."
    enabled: true
    effect: give
    target: agent
    reach: linked
    resource: [food, wood, tools]
    amount: {min: 1, max: 10}
    needs_own: true
    relation_receiver: 0.15
    relation_giver: 0.05
  steal:
    desc: "try to take `amount` (max {amount[max]}) of a person's `resource` on your island; works with chance {success_prob}. Victims and witnesses resent it."
    enabled: true
    effect: steal
    target: agent
    reach: island
    resource: [food, wood, tools]
    amount: {min: 1, max: 3}
    success_prob: 0.6
    relation_victim_success: -0.4
    relation_victim_fail: -0.25
    relation_witness: -0.1
    anonymous: false                            # EP01 switch: true = nobody learns who did it (see treatments)
    anonymous_desc: "try to take `amount` (max {amount[max]}) of a person's `resource` on your island; works with chance {success_prob}. No one will ever know it was you: the victim only finds something missing, and no one else hears of it."
  talk:
    desc: "say something to one person on your island (text in say)."
    enabled: true
    effect: talk
    target: agent
    reach: island
    requires_say: true
    relation_both: 0.03
  propose_law:
    desc: "propose a law for this island (text in say). It passes if more than {pass_fraction} of the adults here back you; they back you if they feel at least {vote_min_relation} toward you."
    enabled: true
    effect: law
    target: none
    requires_say: true
    pass_fraction: 0.5
    vote_min_relation: 0.25                     # cal01: at 0.1 (below the 0.2 neighbour default) every law passed
  store:
    desc: "put `amount` of your `resource` into the island store, which feeds the unnamed villagers and the children."
    enabled: true
    effect: deposit
    target: none
    resource: [food, wood, tools]
    amount: {min: 1, max: 10}
    needs_own: true
    relation_witness: 0.03
  draw:
    desc: "make a drawing or carving others can see (describe it in say)."
    enabled: true
    effect: culture
    target: none
    requires_say: true
  migrate:
    desc: "sail to another island (target = its island id) and live there from now on. Only possible if fewer than {max_named} people live there."
    enabled: true
    effect: migrate
    target: island
    reach: linked
    max_named: 8

# Permanent geography: per-island overrides applied BEFORE any treatment (dotted paths that must exist
# above; dict values are merged). Islands not listed use the base rules. See bible/series_bible.md §3.
island_traits:
  island:orra:   {yield_mult: {food: 1.3, wood: 0.6}, wild.cap: {food: 200, wood: 60}}
  island:varn:   {yield_mult: {food: 0.9, wood: 1.6}, wild.cap: {food: 110, wood: 160}}
  island:stenna: {yield_mult: {food: 0.9, wood: 0.8}, wild.cap: {food: 70, wood: 70}, actions.craft.cost: {wood: 2}}
  island:tiva:   {yield_mult: {food: 1.3, wood: 0.3}, wild.cap: {food: 160, wood: 20}, weather.storm.gather: 0.2}
  island:keld:   {wild.cap: {food: 150, wood: 100}}

# One entry per possible experimental manipulation. An arm picks at most one treatment by name.
# `override` must contain exactly ONE dotted rule path (set allow_multi: true to break this on
# purpose, e.g. a money system that needs two changes - the run header records it either way).
# The three fixtures at the end are engine tests for the one-island smoke world (island:test).
treatments:
  invisible_thief:
    description: "EP01 (pre-registered): theft is anonymous on Orra, Varn, Stenna and Tiva - the victim only finds something missing, nobody else hears of it, and nobody's feelings toward the thief change. Keld is never treated."
    applies_to: ["island:orra", "island:varn", "island:stenna", "island:tiva"]
    override: {actions.steal.anonymous: true}
  no_theft:
    description: "Stealing is impossible on treatment islands."
    applies_to: ["island:test"]
    override: {actions.steal.enabled: false}
  private_store:
    description: "Hungry agents may NOT eat from the island store."
    applies_to: ["island:test"]
    override: {consumption.agents_eat_from_commons: false}
  lean_wild:
    description: "Wild food regrows at a third of the normal rate."
    applies_to: ["island:test"]
    override: {wild.regen.food: 7}
